<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAF7F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1916" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="OUR DAY">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>OUR DAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600&family=Trirong:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: floating ivory sidebar + editorial content column; mobile = sticky top bar + bottom tab bar. */
:root{
  --bg:#FAF7F1; --surface:#FFFDF9; --surface-2:#F3EEE5; --line:#E5DDCE; --ink:#2E2A25; --ink-2:#6C6458; --ink-3:#9A9083;
  --sage:#6F876A; --sage-ink:#4E6649; --sage-soft:#E4EBDF; --rose:#B07F7C; --rose-soft:#F4E5E2; --champ:#B8975E; --champ-soft:#F3EAD8;
  --ok:#5A8656; --warn:#AE7A27; --bad:#B0514A; --ok-soft:#E3EEDF; --warn-soft:#F6EBD5; --bad-soft:#F6E1DE;
  --shadow:0 1px 2px rgba(60,48,30,.05),0 6px 20px rgba(60,48,30,.06); --on-accent:#FFFFFF;
  --f-display:"Trirong","Noto Serif Thai",Georgia,serif; --f-body:"Anuphan","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1916; --surface:#23201C; --surface-2:#2B2722; --line:#3A342D; --ink:#F0EBE2; --ink-2:#B9AF9F; --ink-3:#8C8374;
  --sage:#9DB494; --sage-ink:#B9CDB1; --sage-soft:#2C3829; --rose:#D3A29E; --rose-soft:#3D2C2A; --champ:#D7BC88; --champ-soft:#3A3124;
  --ok:#8CBB85; --warn:#DDAA59; --bad:#E2857C; --ok-soft:#263526; --warn-soft:#3A2F1C; --bad-soft:#3E2523;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --on-accent:#1B1916; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1916; --surface:#23201C; --surface-2:#2B2722; --line:#3A342D; --ink:#F0EBE2; --ink-2:#B9AF9F; --ink-3:#8C8374;
  --sage:#9DB494; --sage-ink:#B9CDB1; --sage-soft:#2C3829; --rose:#D3A29E; --rose-soft:#3D2C2A; --champ:#D7BC88; --champ-soft:#3A3124;
  --ok:#8CBB85; --warn:#DDAA59; --bad:#E2857C; --ok-soft:#263526; --warn-soft:#3A2F1C; --bad-soft:#3E2523;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --on-accent:#1B1916; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body.modal-open{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);font-weight:500;line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,1.2rem + 1.4vw,2.2rem)}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
p{margin:0}
a{color:var(--sage-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.ic{width:20px;height:20px;flex:none}
.sm .ic,.ic.sm{width:16px;height:16px}

/* app frame */
#app{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;max-width:1440px;margin:0 auto}
.side{position:sticky;top:16px;align-self:start;height:calc(100vh - 32px);display:flex;flex-direction:column;gap:20px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 14px}
.brand{padding:0 10px}
.brand b{font-family:var(--f-display);font-weight:600;font-size:1.35rem;letter-spacing:.16em}
.brand small{display:block;font-family:var(--f-display);font-style:italic;color:var(--ink-3);font-size:.82rem;line-height:1.4;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--ink-2);font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--sage-soft);color:var(--sage-ink)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 6px}
.who-chip{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--surface-2);font-size:.86rem}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--ink-3)}
.dot.A{background:var(--sage)} .dot.B{background:var(--rose)} .dot.Both{background:var(--champ)}
.mode-pill{font-size:.75rem;padding:4px 10px;border-radius:999px;background:var(--champ-soft);color:var(--ink-2);align-self:flex-start}
.mode-pill.live{background:var(--ok-soft);color:var(--ok)}
main:focus{outline:none}
.span2{grid-column:span 2}
@media (max-width:1100px){.span2{grid-column:1/-1}}
main{min-width:0;padding-block:8px 64px;display:flex;flex-direction:column;gap:24px}
.topbar{display:none}
.tabbar{display:none}

@media (max-width:880px){
  #app{grid-template-columns:minmax(0,1fr);padding-top:0}
  .side{display:none}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);align-items:center;justify-content:space-between;padding-block:12px;gap:12px;border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar b{font-family:var(--f-display);letter-spacing:.16em;font-weight:600}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;font-size:.68rem;color:var(--ink-3);text-decoration:none;min-width:0}
  .tabbar a[aria-current="page"]{color:var(--sage-ink)}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}

/* generic */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph > div:first-child{display:flex;flex-direction:column;gap:4px;min-width:0}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:14px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:9px 18px;font-weight:500;cursor:pointer;background:var(--surface-2);color:var(--ink);transition:background .15s,transform .1s;white-space:nowrap;text-decoration:none;min-height:40px}
.btn:hover{background:var(--line)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--sage);color:var(--on-accent)}
.btn.primary:hover{background:var(--sage-ink)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--bad);color:var(--on-accent)}
.btn.ghost.danger{background:transparent;color:var(--bad);border-color:transparent}
.btn.sm{padding:5px 12px;font-size:.85rem;min-height:32px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;border:none;background:transparent;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.sm{width:28px;height:28px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:2px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;font-weight:500}
.chip.sage{background:var(--sage-soft);color:var(--sage-ink)}
.chip.rose{background:var(--rose-soft);color:var(--rose)}
.chip.champ{background:var(--champ-soft);color:var(--champ)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1 1 200px;min-width:0}
.input,.toolbar select,.toolbar input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;max-width:100%}
.toolbar input[type=search]{width:100%}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.subnav{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.subnav a{padding:10px 14px;text-decoration:none;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.subnav a[aria-current="page"]{color:var(--ink);border-color:var(--sage)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r-sm);background:var(--champ-soft);font-size:.9rem}
.banner.bad{background:var(--bad-soft)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:32px 16px;color:var(--ink-2)}
.empty h3{color:var(--ink)}
.empty .ic{width:32px;height:32px;color:var(--ink-3)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-weight:500;color:var(--ink-3);font-size:.78rem;letter-spacing:.04em;background:var(--surface-2)}
td.r,th.r{text-align:right}
tbody tr:last-child td{border-bottom:none}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
.wrap{white-space:normal;min-width:180px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:stretch}
.hero-main{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.hero-main::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px solid var(--champ);opacity:.35}
.hero-main::before{content:"";position:absolute;right:10px;top:-30px;width:220px;height:220px;border-radius:50%;border:1px solid var(--sage);opacity:.35}
.couple{font-family:var(--f-display);font-size:clamp(1.8rem,1.2rem + 2vw,2.7rem);line-height:1.2}
.couple i{color:var(--champ);font-weight:400;padding:0 .2em}
.countdown{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.countdown .big{font-family:var(--f-display);font-size:clamp(3rem,2rem + 4vw,4.6rem);line-height:1;color:var(--sage-ink);font-variant-numeric:tabular-nums}
.quote{background:var(--sage-soft);border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:14px;justify-content:space-between}
.quote blockquote{margin:0;font-family:var(--f-display);font-style:italic;font-size:1.2rem;line-height:1.55;color:var(--sage-ink)}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.figs4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){.figs4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fig{display:flex;flex-direction:column;gap:2px;min-width:0}
.fig .lbl{font-size:.8rem;color:var(--ink-3)}
.fig .val{font-size:1.25rem;font-weight:500;font-variant-numeric:tabular-nums}
.fig .val.bad{color:var(--bad)} .fig .val.ok{color:var(--ok)}
.stepper{display:inline-flex;align-items:center;gap:4px}
.li.ci{align-items:center;flex-wrap:wrap}
.sim{border-color:var(--champ)}
.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.stack span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.c-paid{background:var(--sage)} .c-comm{background:var(--champ)} .c-plan{background:var(--rose-soft);outline:1px dashed var(--rose);outline-offset:-1px}
.ring{display:flex;align-items:center;gap:18px}
.ring svg{width:110px;height:110px;flex:none}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li .t{font-weight:500}
.li .s{font-size:.82rem;color:var(--ink-3)}
.li .grow{flex:1;min-width:0}
.datebox{flex:none;width:52px;text-align:center;border-radius:10px;background:var(--surface-2);padding:4px 0;line-height:1.2}
.datebox b{display:block;font-size:1.1rem;font-variant-numeric:tabular-nums}
.datebox small{font-size:.7rem;color:var(--ink-3)}
.datebox.bad{background:var(--bad-soft);color:var(--bad)}

/* tasks */
.trow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:none}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink-3);background:transparent;display:grid;place-items:center;cursor:pointer;color:transparent;margin-top:2px}
.check:hover{border-color:var(--sage)}
.check[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);color:var(--surface)}
.check .ic{width:14px;height:14px}
.trow-main{flex:1;min-width:0;text-align:left;background:none;border:none;cursor:pointer;padding:0;display:flex;flex-direction:column;gap:4px}
.trow-title{font-weight:500}
.is-done .trow-title{text-decoration:line-through;color:var(--ink-3)}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.quickadd{display:flex;gap:8px}
.quickadd input{flex:1;min-width:0;border:1px dashed var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-family:var(--f-body);font-size:.9rem;font-weight:600;display:flex;justify-content:space-between}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.bcard button.t{background:none;border:none;padding:0;text-align:left;cursor:pointer;font-weight:500}
.bcard select{font-size:.8rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:3px 6px}
.gantt{display:flex;flex-direction:column;gap:6px;min-width:640px}
.g-row{display:grid;grid-template-columns:200px 1fr;gap:10px;align-items:center;font-size:.85rem}
.g-row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:none;text-align:left;cursor:pointer;padding:0}
.g-track{position:relative;height:18px;background:var(--surface-2);border-radius:6px}
.g-bar{position:absolute;top:3px;height:12px;border-radius:6px;background:var(--sage);min-width:6px}
.g-bar.done{background:var(--ink-3);opacity:.5}.g-bar.od{background:var(--bad)}
.g-axis{position:relative;height:20px;margin-left:210px;font-size:.7rem;color:var(--ink-3)}
.g-axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.g-wed{position:absolute;top:0;bottom:0;width:2px;background:var(--rose)}

/* budget chart */
.cat-rows{display:flex;flex-direction:column;gap:12px}
.cat-row{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 190px;gap:12px;align-items:center;font-size:.86rem}
.cat-row .bar{position:relative;height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.cat-row .bar span{position:absolute;top:0;bottom:0}
.cat-row .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
@media (max-width:640px){.cat-row{grid-template-columns:minmax(0,1fr) auto}.cat-row .bar{grid-column:1/-1;order:3}.cat-row{grid-template-columns:minmax(0,1fr) auto}}

/* vendors / ideas cards */
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.vcard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.vcard h3{font-size:1.05rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.86rem}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.vcard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;align-items:center}
.cmpbar{position:sticky;bottom:16px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-radius:999px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow)}
@media (max-width:880px){.cmpbar{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.icard .img{aspect-ratio:4/3;max-width:100%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-3);overflow:hidden}
.icard .img img{width:100%;height:100%;object-fit:cover}
.icard .img.ph-pattern{background:repeating-linear-gradient(135deg,var(--surface-2) 0 12px,var(--champ-soft) 12px 24px)}
.icard .body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.votes{display:flex;gap:6px;flex-wrap:wrap}
.vote{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.82rem;cursor:pointer}
.vote[aria-pressed="true"]{background:var(--sage-soft);border-color:var(--sage);color:var(--sage-ink)}
.final{outline:2px solid var(--champ);outline-offset:-2px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--surface-2);text-align:center;font-size:.75rem;color:var(--ink-3);padding:6px 0}
.cal .day{background:var(--surface);min-height:96px;padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;border:none;cursor:pointer;min-width:0}
.cal .day:hover{background:var(--surface-2)}
.cal .day.other{background:var(--bg)}

function todayISO(){try{return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}catch(e){return new Date().toISOString().slice(0,10)}}

function longThai(s){if(!isISO(s))return '';try{return new Intl.DateTimeFormat('th-TH',{dateStyle:'full',timeZone:'UTC'}).format(new Date(toUTC(s)))}catch(e){return fmtD(s)}}

function parseCSV(text){const rows=[];let row=[],f='',q=false;text=text.replace(/^﻿/,'');for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()!==''))}

function expCalc(e){const pays=e.payments||[];const paid=round2(pays.filter(p=>p.paid).reduce((s,p)=>s+num(p.amount),0));const agreed=(e.agreed===null||e.agreed===''||e.agreed===undefined)?null:num(e.agreed);const est=num(e.estimated);const base=agreed!==null?agreed:est;const projected=Math.max(base,paid);const outstanding=agreed!==null?Math.max(round2(agreed-paid),0):0;const status=agreed===null?(paid>0?'committed':'planned'):(agreed>0&&paid>=agreed?'paid':'committed');const next=pays.filter(p=>!p.paid&&isISO(p.due)).sort((a,b)=>a.due.localeCompare(b.due))[0]||null;return {paid,agreed,est,projected,outstanding,status,next}}
function budget(){const st=S.settings||{};const total=num(st.budget);let paid=0,comm=0,proj=0,planned=0;const byCat={};CATS.forEach(c=>byCat[c[0]]={paid:0,comm:0,plan:0,proj:0,budget:num((st.catBudgets||{})[c[0]])});
 arr('expenses').forEach(e=>{const c=expCalc(e);paid+=c.paid;comm+=c.outstanding;proj+=c.projected;const pl=c.agreed===null?Math.max(c.est-c.paid,0):0;planned+=pl;const b=byCat[e.cat]||(byCat[e.cat]={paid:0,comm:0,plan:0,proj:0,budget:0});b.paid+=c.paid;b.comm+=c.outstanding;b.plan+=pl;b.proj+=c.projected});
 return {total,paid:round2(paid),comm:round2(comm),planned:round2(planned),proj:round2(proj),cash:round2(total-paid),afterProj:round2(total-proj),byCat}}
function risk(b){if(!b.budget)return b.proj>0?'':'';if(b.proj>b.budget)return 'over';if(b.proj>=b.budget*.9)return 'near';return ''}
function taskStats(){const t=arr('tasks');const done=t.filter(x=>x.status==='done').length;return {total:t.length,done,pct:t.length?Math.round(done/t.length*100):0}}
function payItems(){const out=[];arr('expenses').forEach(e=>(e.payments||[]).forEach(p=>out.push({e,p})));return out}
function guestStats(){const g=arr('guests');const heads=x=>1+Math.max(0,Math.floor(num(x.plus)));const st={invited:0,yes:0,no:0,pending:0,maybe:0,rows:g.length};g.forEach(x=>{const h=heads(x);st.invited+=h;st[x.rsvp||'pending']+=h});st.cost=st.yes*num((S.settings||{}).costPerHead);st.projCost=(st.yes+st.pending+st.maybe)*num((S.settings||{}).costPerHead);return st}
function weekInfo(t){const ws=weekStart(t),we=addDays(ws,6);const inW=d=>isISO(d)&&d>=ws&&d<=we;const tasks=arr('tasks');return {ws,we,due:tasks.filter(x=>x.status!=='done'&&inW(x.due)),doneW:tasks.filter(x=>x.completedAt&&inW(x.completedAt.slice(0,10))),pays:payItems().filter(o=>!o.p.paid&&inW(o.p.due)),events:arr('events').filter(e=>inW(e.date))}}
function upcoming(t,n){const end=addDays(t,n);const out=[];arr('tasks').forEach(x=>{if(x.status!=='done'&&isISO(x.due)&&x.due>=t&&x.due<=end)out.push({d:x.due,k:'task',t:x.title,s:'งาน · '+nameOf(x.who),act:'editTask',id:x.id})});payItems().forEach(({e,p})=>{if(!p.paid&&isISO(p.due)&&p.due>=t&&p.due<=end)out.push({d:p.due,k:'pay',t:`${PAY_KIND[p.kind]||'ชำระ'} · ${e.name}`,s:fmtB(p.amount)+' · '+nameOf(e.who),act:'editExpense',id:e.id})});arr('events').forEach(v=>{if(isISO(v.date)&&v.date>=t&&v.date<=end)out.push({d:v.date,k:'ev',t:v.title,s:(EV_TYPES[v.type]||EV_TYPES.other)[0]+(v.time?' · '+v.time:''),act:'editEvent',id:v.id})});return out.sort((a,b)=>a.d.localeCompare(b.d))}
function milestones(){const ms=[];const st=taskStats();const v=arr('vendors');if(S.settings&&S.settings.weddingDate)ms.push({k:'setup',t:'เริ่มวางแผนด้วยกัน'});if(v.some(x=>x.cat==='venue'&&['booked','completed'].includes(x.status)))ms.push({k:'venue',t:'ได้สถานที่แล้ว'});if(v.filter(x=>['booked','completed'].includes(x.status)).length>=3)ms.push({k:'v3',t:'จองผู้ให้บริการครบ 3 ราย'});if(st.total>=5)[25,50,75,100].forEach(p=>{if(st.pct>=p)ms.push({k:'p'+p,t:p===100?'เช็กลิสต์ครบทุกข้อ':`เช็กลิสต์ ${p}%`})});if(arr('ideas').some(i=>i.final))ms.push({k:'decide',t:'ตัดสินใจร่วมกันครั้งแรก'});if(arr('memories').length)ms.push({k:'mem',t:'ความทรงจำแรกในสมุด'});const g=guestStats();if(g.invited>=10&&g.yes/g.invited>=.5)ms.push({k:'rsvp',t:'แขกตอบรับเกินครึ่ง'});return ms}
function qIndex(d){return Math.abs(Math.floor(toUTC(d)/864e5))%QUESTIONS.length}
function weekQuests(t){const ws=weekStart(t);const n=Math.floor(toUTC(ws)/(7*864e5));const out=[];for(let i=0;i<4;i++)out.push(QUESTS[(n*3+i)%QUESTS.length]);return out}
function questProgress(q,t){const w=weekInfo(t);if(q.auto==='tasks')return {cur:w.doneW.length,need:3};if(q.auto==='answers'){const c=arr('answers').filter(a=>a.id>=w.ws&&a.id<=w.we&&a.A&&a.B).length;return {cur:c,need:3}}if(q.auto==='memory'){const c=arr('memories').filter(m=>m.createdAt&&m.createdAt.slice(0,10)>=w.ws).length;return {cur:c,need:1}}return null}

function vTasks(){const t=todayISO();const u=S.ui;let list=arr('tasks');const all=list.length;
 if(u.tq)list=list.filter(x=>(x.title+' '+(x.desc||'')+' '+(x.notes||'')).toLowerCase().includes(u.tq.toLowerCase()));
 if(u.tst==='open')list=list.filter(x=>x.status!=='done');else if(u.tst==='overdue')list=list.filter(x=>x.status!=='done'&&isISO(x.due)&&x.due<t);else if(u.tst!=='all')list=list.filter(x=>x.status===u.tst);
 if(u.twho!=='all')list=list.filter(x=>x.who===u.twho||(u.twho!=='Both'&&x.who==='Both'));if(u.tcat!=='all')list=list.filter(x=>x.cat===u.tcat);
 const pr={high:0,med:1,low:2};list.sort(u.tsort==='prio'?(a,b)=>(pr[a.prio]??1)-(pr[b.prio]??1)||(a.due||'9').localeCompare(b.due||'9'):u.tsort==='created'?(a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''):(a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
 const ts=taskStats();
 const tb=`<div class="toolbar"><div class="grow"><label class="sr" for="tq">ค้นหางาน</label><input type="search" id="tq" data-ui="tq" placeholder="ค้นหางาน" value="${esc(u.tq)}"></div><div class="fscroll">
 ${sel('tst','สถานะ',[['open','ยังไม่เสร็จ'],['all','ทั้งหมด'],['overdue','เลยกำหนด'],...Object.entries(TASK_ST)],u.tst)}${sel('twho','ผู้รับผิดชอบ',[['all','ทุกคน'],...whoOpts()],u.twho)}${sel('tcat','หมวด',[['all','ทุกหมวด'],...TASK_CATS],u.tcat)}${sel('tsort','เรียง',[['due','ตามกำหนด'],['prio','ตามความสำคัญ'],['created','เพิ่มล่าสุด']],u.tsort)}
 <span class="seg" role="group" aria-label="มุมมอง">${[['list','รายการ'],['board','บอร์ด'],['timeline','ไทม์ไลน์']].map(([k,l])=>`<button type="button" data-act="setUi" data-id="taskView:${k}" aria-pressed="${u.taskView===k}">${l}</button>`).join('')}</span></div></div>`;
 let body;
 if(!all)body=`<div class="card">${empty('plan','ยังไม่มีงานในเช็กลิสต์','เริ่มจากแม่แบบ 12 เดือนถึงวันงาน หรือพิมพ์งานแรกด้านบน',`<button class="btn primary" data-act="templates">เพิ่มจากแม่แบบ</button>`)}</div>`;
 else if(u.taskView==='board')body=`<div class="board">${Object.entries(TASK_ST).map(([k,l])=>{const items=list.filter(x=>x.status===k||(u.tst==='open'&&false));const col=(u.tst==='open'&&k==='done')?arr('tasks').filter(x=>x.status==='done'):items;return `<section class="col" aria-label="${l}"><h3>${l}<span class="muted">${col.length}</span></h3>${col.map(x=>`<div class="bcard"><button class="t" data-act="editTask" data-id="${x.id}">${esc(x.title)}</button><div class="meta">${taskChips(x,t)}</div><label class="sr" for="mv_${x.id}">ย้ายสถานะ</label><select id="mv_${x.id}" data-chg="moveTask" data-id="${x.id}">${Object.entries(TASK_ST).map(([s,sl])=>`<option value="${s}" ${s===x.status?'selected':''}>${sl}</option>`).join('')}</select></div>`).join('')||'<p class="muted" style="font-size:.85rem">ว่าง</p>'}</section>`}).join('')}</div>`;
 else if(u.taskView==='timeline')body=timeline(list,t);
 else body=list.length?`<ul class="list card" style="padding:4px 8px;gap:0">${list.map(x=>taskRow(x,t)).join('')}</ul>`:`<div class="card">${empty('search','ไม่พบงานที่ตรงกับตัวกรอง','ลองเปลี่ยนตัวกรองหรือคำค้นหา')}</div>`;
 return ph('วางแผน','เช็กลิสต์ของเรา',`<button class="btn ghost" data-act="templates">แม่แบบ</button><button class="btn primary" data-act="newTask">${icon('plus','sm')} เพิ่มงาน</button>`)+planNav()+
 `<div class="banner" style="background:var(--sage-soft)"><span>เสร็จแล้ว <b class="num">${ts.done}</b> จาก <b class="num">${ts.total}</b> งาน (${ts.pct}%)</span><span class="stack" style="flex:1 1 160px;max-width:320px"><span class="c-paid" style="width:${ts.pct}%"></span></span></div>

function sel(key,label,opts,val){return `<label class="sr" for="u_${key}">${label}</label><select id="u_${key}" data-ui="${key}" aria-label="${label}">${opts.map(([k,l])=>`<option value="${esc(k)}" ${k===val?'selected':''}>${esc(l)}</option>`).join('')}</select>`}
function taskChips(x,t){const c=[];if(isISO(x.due)){const d=dayDiff(t,x.due);c.push(x.status!=='done'&&d<0?`<span class="chip bad">เลยกำหนด ${fmtD(x.due)}</span>`:x.status!=='done'&&d<=7?`<span class="chip warn">${d===0?'วันนี้':'อีก '+d+' วัน'}</span>`:`<span class="chip">${fmtD(x.due)}</span>`)}c.push(`<span class="chip"><span class="dot ${x.who}"></span>${esc(nameOf(x.who))}</span>`);c.push(`<span class="chip">${esc(TCAT[x.cat]||'—')}</span>`);if(x.prio==='high')c.push('<span class="chip rose">สำคัญมาก</span>');if(x.status==='doing')c.push('<span class="chip sage">กำลังทำ</span>');if(x.status==='waiting')c.push('<span class="chip champ">รอผล</span>');if((x.comments||[]).length)c.push(`<span class="chip">${x.comments.length} ความเห็น</span>`);return c.join('')}
function taskRow(x,t){const d=x.status==='done';return `<li class="trow ${d?'is-done':''}"><button class="check" data-act="toggleTask" data-id="${x.id}" aria-pressed="${d}" aria-label="${d?'ยกเลิกเสร็จ':'ทำเครื่องหมายว่าเสร็จ'}: ${esc(x.title)}">${icon('check')}</button><button class="trow-main" data-act="editTask" data-id="${x.id}"><span class="trow-title">${esc(x.title)}</span><span class="meta">${taskChips(x,t)}</span></button></li>`}
function timeline(list,t){const items=list.filter(x=>isISO(x.due));if(!items.length)return `<div class="card">${empty('calendar','ยังไม่มีงานที่มีกำหนดวัน','ใส่วันเริ่มและกำหนดเสร็จให้งาน แล้วไทม์ไลน์จะแสดงที่นี่')}</div>`;const wd=S.settings.weddingDate;let min=items.reduce((m,x)=>{const s=isISO(x.start)?x.start:addDays(x.due,-7);return s<m?s:m},t);let max=items.reduce((m,x)=>x.due>m?x.due:m,isISO(wd)?wd:t);min=min.slice(0,8)+'01';const range=Math.max(1,dayDiff(min,max)+1);const pos=d=>Math.max(0,Math.min(100,dayDiff(min,d)/range*100));
 const ticks=[];let m=min;while(m<=max){ticks.push(m);const [y,mo]=m.split('-').map(Number);m=(mo===12?`${y+1}-01`:`${y}-${String(mo+1).padStart(2,'0')}`)+'-01'}const step=Math.ceil(ticks.length/10);
 return `<div class="card" style="overflow-x:auto"><div class="gantt"><div class="g-axis">${ticks.filter((_,i)=>i%step===0).map(d=>`<span style="left:${pos(d)}%">${TH_MON[+d.slice(5,7)-1]} ${String((+d.slice(0,4)+(S.settings.yearStyle==='be'?543:0))).slice(2)}</span>`).join('')}</div>
 ${items.sort((a,b)=>a.due.localeCompare(b.due)).map(x=>{const s=isISO(x.start)&&x.start<=x.due?x.start:addDays(x.due,-7);const od=x.status!=='done'&&x.due<t;return `<div class="g-row"><button class="lab" data-act="editTask" data-id="${x.id}" title="${esc(x.title)}">${esc(x.title)}</button><div class="g-track">${isISO(wd)?`<span class="g-wed" style="left:${pos(wd)}%" title="วันแต่งงาน"></span>`:''}<span class="g-bar ${x.status==='done'?'done':od?'od':''}" style="left:${pos(s)}%;width:${Math.max(.8,pos(x.due)-pos(s))}%" title="${fmtD(s)}–${fmtD(x.due)}"></span></div></div>`}).join('')}</div><p class="help">เส้นสีชมพูคือวันแต่งงาน · แถบแดงคืองานที่เลยกำหนด</p></div>`}

function calItems(){const out=[];const wd=S.settings.weddingDate;if(isISO(wd))out.push({d:wd,t:'วันแต่งงาน',c:'rose',act:'goDay',id:''});arr('tasks').forEach(x=>{if(isISO(x.due))out.push({d:x.due,t:x.title,c:'sage',act:'editTask',id:x.id,done:x.status==='done',k:'งาน'})});payItems().forEach(({e,p})=>{if(isISO(p.due))out.push({d:p.due,t:`${PAY_KIND[p.kind]||'ชำระ'} ${e.name}`,c:'champ',act:'editExpense',id:e.id,done:p.paid,k:'ชำระเงิน '+fmtB(p.amount)})});arr('events').forEach(v=>{if(isISO(v.date)){const ty=EV_TYPES[v.type]||EV_TYPES.other;out.push({d:v.date,time:v.time,t:v.title,c:ty[1],act:'editEvent',id:v.id,k:ty[0]})}});return out.sort((a,b)=>a.d.localeCompare(b.d)||(a.time||'').localeCompare(b.time||''))}
function vCalendar(){const t=todayISO();const u=S.ui;const m=u.calMonth||t.slice(0,7);const [y,mo]=m.split('-').map(Number);const items=calItems();const by={};items.forEach(i=>(by[i.d]=by[i.d]||[]).push(i));const first=`${m}-01`;const lead=dow(first);const dim=new Date(Date.UTC(y,mo,0)).getUTCDate();const yy=S.settings.yearStyle==='be'?y+543:y;
 const legend=`<div class="legend"><span><i style="background:var(--sage)"></i>งาน</span><span><i style="background:var(--champ)"></i>ชำระเงิน/ลองชุด</span><span><i style="background:var(--rose)"></i>นัดผู้ให้บริการ/พิธี</span></div>`;
 let body;if(u.calView==='agenda'){const list=items.filter(i=>i.d>=t).slice(0,80);const grp={};list.forEach(i=>(grp[i.d]=grp[i.d]||[]).push(i));body=list.length?`<div class="card"><ul class="list">${Object.keys(grp).map(d=>`<li class="li"><span class="datebox"><b>${d.slice(8)}</b><small>${TH_MON[+d.slice(5,7)-1]}</small></span><div class="grow" style="display:flex;flex-direction:column;gap:6px">${grp[d].map(evLine).join('')}</div></li>`).join('')}</ul></div>`:`<div class="card">${empty('calendar','ไม่มีกำหนดการข้างหน้า','เพิ่มนัดดูสถานที่ ลองชุด หรือนัดครอบครัว',`<button class="btn primary" data-act="newEvent">เพิ่มนัดหมาย</button>`)}</div>`}
 else{let cells='';for(let i=0;i<lead;i++)cells+='<div class="day other" aria-hidden="true"></div>';for(let d=1;d<=dim;d++){const iso=`${m}-${String(d).padStart(2,'0')}`;const its=by[iso]||[];cells+=`<button class="day ${iso===t?'today':''} ${iso===u.calDay?'sel':''} ${iso===S.settings.weddingDate?'wed':''}" data-act="calDay" data-id="${iso}" aria-label="${fmtD(iso)} ${its.length?its.length+' รายการ':''}"><span class="n">${d}</span>${its.slice(0,3).map(i=>`<span class="ev ${i.c} ${i.done?'done':''}">${i.time?i.time+' ':''}${esc(i.t)}</span>`).join('')}${its.length>3?`<span class="muted" style="font-size:.7rem">+${its.length-3}</span>`:''}</button>`}
  const sd=u.calDay&&u.calDay.startsWith(m)?u.calDay:null;const dayList=sd?(by[sd]||[]):[];
  body=`<div class="cal" aria-label="${TH_MONTH[mo-1]} ${yy}">${TH_DOW.map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>${sd?`<section class="card"><div class="card-h"><h2>${esc(longThai(sd))}</h2><button class="btn sm primary" data-act="newEvent" data-id="${sd}">${icon('plus','sm')} นัดหมายวันนี้</button></div>${dayList.length?`<div style="display:flex;flex-direction:column;gap:8px">${dayList.map(evLine).join('')}</div>`:'<p class="muted">วันนี้ยังว่าง</p>'}</section>`:''}`}
 return ph('ปฏิทิน','กำหนดการทั้งหมด',`<button class="btn primary" data-act="newEvent">${icon('plus','sm')} เพิ่มนัดหมาย</button>`)+`<div class="toolbar"><span class="seg" role="group" aria-label="มุมมองปฏิทิน">${[['month','รายเดือน'],['agenda','รายการ']].map(([k,l])=>`<button type="button" data-act="setUi" data-id="calView:${k}" aria-pressed="${u.calView===k}">${l}</button>`).join('')}</span>${u.calView==='month'?`<span class="calnav toolbar" style="flex-wrap:nowrap;gap:2px"><button class="icon-btn" data-act="calNav" data-id="-1" aria-label="เดือนก่อน">${icon('left')}</button><h2 style="min-width:150px;text-align:center">${TH_MONTH[mo-1]} ${yy}</h2><button class="icon-btn" data-act="calNav" data-id="1" aria-label="เดือนถัดไป">${icon('right')}</button></span><button class="btn sm ghost" data-act="calNav" data-id="0">วันนี้</button>${isISO(S.settings.weddingDate)?`<button class="btn sm ghost" data-act="calNav" data-id="wed">เดือนแต่งงาน</button>`:''}`:''}</div>`+legend+body}
function evLine(i){return `<button class="trow-main" data-act="${i.act}" data-id="${i.id}" style="flex-direction:row;align-items:center;gap:10px"><span class="ev ${i.c} ${i.done?'done':''}" style="flex:none">${esc(i.k||'')}</span><span>${i.time?`<b class="num">${esc(i.time)}</b> `:''}${esc(i.t)}</span></button>`}

/* ================= GIFTS / INCOME ================= */
function giftStats(){const g=arr('gifts');const st={total:0,count:g.length,by:{},unthanked:0,items:0};g.forEach(x=>{const a=x.method==='item'?0:num(x.amount);st.total+=a;st.by[x.type]=(st.by[x.type]||0)+a;if(!x.thanked)st.unthanked++;if(x.method==='item')st.items++});st.total=round2(st.total);return st}
function vGifts(){const u=S.ui;const st=giftStats();const b=budget();const gname=Object.fromEntries(arr('guests').map(g=>[g.id,g.name]));let list=arr('gifts');
 if(u.gfq)list=list.filter(x=>((x.from||'')+' '+(x.item||'')+' '+(x.note||'')).toLowerCase().includes(u.gfq.toLowerCase()));if(u.gft!=='all')list=list.filter(x=>x.type===u.gft);if(u.gfth==='no')list=list.filter(x=>!x.thanked);if(u.gfth==='yes')list=list.filter(x=>x.thanked);
 list.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||'').localeCompare(a.createdAt||''));
 const net=round2(b.proj-st.total);
 return ph('วางแผน','ซองช่วยงานและเงินสมทบ',`<button class="btn ghost" data-act="exportGifts">${icon('download','sm')} ส่งออก CSV</button><button class="btn primary" data-act="newGift">${icon('plus','sm')} บันทึกรายรับ</button>`)+planNav()+

 <div class="toolbar"><div class="grow"><label class="sr" for="gfq">ค้นหารายรับ</label><input type="search" id="gfq" data-ui="gfq" placeholder="ค้นหาชื่อ สิ่งของ หรือบันทึก" value="${esc(u.gfq)}"></div><div class="fscroll">${sel('gft','ประเภท',[['all','ทุกประเภท'],...Object.entries(GIFT_TYPE)],u.gft)}${sel('gfth','การขอบคุณ',[['all','ทั้งหมด'],['no','ยังไม่ได้ขอบคุณ'],['yes','ขอบคุณแล้ว']],u.gfth)}</div></div>
 ${arr('gifts').length?(list.length?`<div class="table-wrap rtw"><table class="rt"><thead><tr><th>วันที่</th><th>จาก</th><th>ประเภท</th><th>รูปแบบ</th><th class="r">จำนวนเงิน</th><th>รายละเอียด</th><th>ขอบคุณแล้ว</th></tr></thead><tbody>${list.map(x=>`<tr class="click" data-act="editGift" data-id="${x.id}" tabindex="0"><td data-l="วันที่">${fmtD(x.date)}</td><td class="wrap c-main">${esc(x.from)}${x.guestId&&gname[x.guestId]&&gname[x.guestId]!==x.from?`<div class="muted" style="font-size:.78rem">แขก: ${esc(gname[x.guestId])}</div>`:''}</td><td data-l="ประเภท">${esc(GIFT_TYPE[x.type]||'—')}</td><td class="m-hide">${esc(GIFT_METHOD[x.method]||'—')}</td><td class="r num" data-l="จำนวน">${x.method==='item'?(num(x.amount)?'<span class="muted">มูลค่า ~'+fmtB(x.amount)+'</span>':'—'):fmtB(x.amount)}</td><td class="wrap" data-l="รายละเอียด">${esc([x.item,x.note].filter(Boolean).join(' · ')||'—')}</td><td data-l="ขอบคุณแล้ว"><button class="check" data-act="thank" data-id="${x.id}" aria-pressed="${!!x.thanked}" aria-label="ขอบคุณ ${esc(x.from)} แล้ว">${icon('check')}</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="card">${empty('search','ไม่มีรายการตามตัวกรอง','ลองเปลี่ยนตัวกรองหรือคำค้นหา')}</div>`):`<div class="card">${empty('coin','ยังไม่มีรายรับ','บันทึกเงินสมทบจากครอบครัวได้ตั้งแต่วันนี้ ส่วนซองช่วยงานบันทึกได้ระหว่างเช็กอินแขกในโหมดวันงาน',`<button class="btn primary" data-act="newGift">บันทึกรายรับ</button>`)}</div>`}

function giftForm(id,preset){const x=id?S.data.gifts.get(id):null;if(id&&!x)return;const v=x?clone(x):Object.assign({type:'envelope',method:'cash',date:todayISO()},preset||{});

  onSave(o){const n=Object.assign(x?clone(x):{id:uid()},o,{amount:o.amount===null?0:o.amount});if(!Store.put('gifts',n))return false;logAct(x?`แก้ไขรายรับจาก ${n.from}`:`บันทึก${GIFT_TYPE[n.type]}จาก ${n.from}`);toast('บันทึกรายรับแล้ว')},
  onDelete(){if(Store.del('gifts',x.id)){logAct(`ลบรายรับจาก ${x.from}`);toast('ลบแล้ว')}}})}

/* ================= CHECK-IN ================= */
function checkinHtml(){const u=S.ui;const gs=arr('guests').filter(x=>x.rsvp!=='no');const heads=x=>1+Math.max(0,Math.floor(num(x.plus)));const expected=gs.filter(x=>x.rsvp==='yes').reduce((s,x)=>s+heads(x),0);const arrived=gs.filter(x=>x.checkedIn).reduce((s,x)=>s+num(x.arrivedHeads||heads(x)),0);const q=(u.ciq||'').toLowerCase();const giftBy=new Set(arr('gifts').map(g=>g.guestId).filter(Boolean));
 const shown=gs.filter(x=>!q||(x.name+' '+(x.table||'')+' '+(x.phone||'')).toLowerCase().includes(q)).sort((a,b)=>(a.checkedIn?1:0)-(b.checkedIn?1:0)||a.name.localeCompare(b.name,'th'));const lim=q?80:40;
 return `<section class="card"><div class="card-h"><h2 style="display:flex;gap:8px;align-items:center">${icon('guests')} เช็กอินแขก</h2><span class="chip ${expected&&arrived>=expected?'ok':'sage'}">มาแล้ว ${arrived} / ยืนยัน ${expected} คน</span></div>
 <div class="toolbar"><div class="grow"><label class="sr" for="ciq">ค้นหาแขกเพื่อเช็กอิน</label><input type="search" id="ciq" data-ui="ciq" placeholder="พิมพ์ชื่อ เบอร์ หรือเลขโต๊ะ" value="${esc(u.ciq)}" autocomplete="off"></div><button class="btn ghost" data-act="walkIn">${icon('plus','sm')} แขกที่ไม่มีในรายชื่อ</button></div>
 ${gs.length?(shown.length?`<ul class="list">${shown.slice(0,lim).map(x=>`<li class="li ci"><button class="check" data-act="checkIn" data-id="${x.id}" aria-pressed="${!!x.checkedIn}" aria-label="เช็กอิน ${esc(x.name)}">${icon('check')}</button><div class="grow"><p class="big-text">${esc(x.name)}${x.table?` <span class="chip sage">โต๊ะ ${esc(x.table)}</span>`:''}${x.rsvp!=='yes'?` <span class="chip">${esc(RSVP[x.rsvp||'pending'])}</span>`:''}</p><p class="s muted">${heads(x)>1?'ผู้ติดตาม '+(heads(x)-1)+' คน':'มาคนเดียว'}${x.diet?' · '+esc(x.diet):''}</p></div>${x.checkedIn?`<span class="stepper" role="group" aria-label="จำนวนที่มาจริงของ ${esc(x.name)}"><button class="icon-btn sm" data-act="heads" data-id="${x.id}:-1" aria-label="ลดจำนวน">−</button><b class="num">${num(x.arrivedHeads||heads(x))}</b><button class="icon-btn sm" data-act="heads" data-id="${x.id}:1" aria-label="เพิ่มจำนวน">+</button></span>`:''}<button class="btn sm ${giftBy.has(x.id)?'':'ghost'}" data-act="giftFor" data-id="${x.id}">${giftBy.has(x.id)?'ดูซอง':'บันทึกซอง'}</button></li>`).join('')}</ul>${shown.length>lim?`<p class="help">แสดง ${lim} รายชื่อแรก พิมพ์ค้นหาเพื่อหาคนอื่น</p>`:''}`:'<p class="muted">ไม่พบชื่อนี้ กด “แขกที่ไม่มีในรายชื่อ” เพื่อเพิ่ม</p>'):'<p class="muted">ยังไม่มีรายชื่อแขก เพิ่มได้ในหน้าแขก</p>'}</section>`}

/* ================= WHAT-IF ================= */
function simulate(){const u=S.ui,s=S.settings,b=budget(),g=guestStats();const baseGuests=(g.yes+g.pending+g.maybe)||num(s.guestEstimate);const guests=u.simGuests!==''?Math.max(0,Math.floor(num(u.simGuests))):baseGuests;const ph=u.simPh!==''?num(u.simPh):num(s.costPerHead);const cats={};CATS.forEach(c=>cats[c[0]]=b.byCat[c[0]].proj);
 if(u.simCatering&&ph>0)cats.catering=Math.max(round2(guests*ph),b.byCat.catering.paid);
 let swap=null;if(u.simVendor){const v=S.data.vendors.get(u.simVendor);if(v){const k=CAT[v.cat]?v.cat:'misc';const price=num(v.negotiated)||num(v.quoted);if(price){swap={k,name:v.name};cats[k]=Math.max(price,b.byCat[k].paid)}}}
 CATS.forEach(c=>{const raw=u['sa_'+c[0]];if(raw!==undefined&&String(raw).trim()!==''){const pct=Number(raw);if(isFinite(pct))cats[c[0]]=Math.max(b.byCat[c[0]].paid,round2(cats[c[0]]*(1+pct/100)))}});
 const extra=num(u.simExtra);const total=round2(Object.values(cats).reduce((x,y)=>x+y,0)+extra);const env=round2(guests*num(u.simEnv));
 return {guests,ph,cats,extra,total,swap,delta:round2(total-b.proj),vsBudget:round2(b.total-total),env,net:round2(total-env)}}
const sgn=n=>(n>0?'+':n<0?'−':'')+fmtB(Math.abs(n));

 <div class="fgrid">${inp('simGuests','จำนวนแขก (คน)',u.simGuests,String(r.guests))}${inp('simPh','ค่าอาหารต่อหัว (บาท)',u.simPh,String(num(S.settings.costPerHead)))}
 <div class="field"><label for="simVendor">ถ้าเปลี่ยนไปใช้ผู้ให้บริการ</label><select id="simVendor" data-ui="simVendor">${venOpts.map(([k,l])=>`<option value="${esc(k)}" ${u.simVendor===k?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
 ${inp('simExtra','เพิ่มรายการใหม่ (บาท)',u.simExtra,'0')}${inp('simEnv','ซองเฉลี่ยต่อแขก (บาท)',u.simEnv,'เช่น 1000')}
 <div class="field" style="justify-content:flex-end"><label class="checkline"><input type="checkbox" id="simCatering" data-ui="simCatering" ${u.simCatering?'checked':''}> คิดค่าอาหาร = จำนวนแขก × ค่าต่อหัว</label></div></div>
 <details ${CATS.some(c=>u['sa_'+c[0]])?'open':''}><summary style="cursor:pointer;font-size:.9rem">ปรับรายหมวด (± %)</summary><div class="fgrid" style="margin-top:10px">${CATS.filter(c=>b.byCat[c[0]].proj>0).map(c=>inp('sa_'+c[0],`${c[1]} · ${fmtB(b.byCat[c[0]].proj)}`,u['sa_'+c[0]]??'','เช่น -10 หรือ 15')).join('')||'<p class="muted">ยังไม่มีค่าใช้จ่ายให้ปรับ</p>'}</div></details>
 <div class="figs figs4"><div class="fig"><span class="lbl">คาดการณ์ตอนนี้</span><span class="val">${fmtB(b.proj)}</span></div><div class="fig"><span class="lbl">ถ้าเป็นแบบนี้</span><span class="val">${fmtB(r.total)}</span></div><div class="fig"><span class="lbl">ต่างจากตอนนี้</span><span class="val ${r.delta>0?'bad':r.delta<0?'ok':''}">${sgn(r.delta)}</span></div><div class="fig"><span class="lbl">${r.vsBudget<0?'เกินงบรวม':'เหลือจากงบรวม'}</span><span class="val ${r.vsBudget<0?'bad':'ok'}">${fmtB(Math.abs(r.vsBudget))}</span></div>
 ${num(u.simEnv)?`<div class="fig"><span class="lbl">ซองที่คาดว่าจะได้ (${r.guests} คน)</span><span class="val">${fmtB(r.env)}</span></div><div class="fig"><span class="lbl">ต้นทุนสุทธิที่คาด</span><span class="val">${fmtB(r.net)}</span></div>`:''}</div>

function fieldHtml(f,v){const id='f_'+f.k;const lab=`<label for="${id}">${esc(f.label)}${f.req?' <span class="req" aria-hidden="true">*</span>':''}</label>`;let inp;const aria=`aria-describedby="${id}_err"`;

function readForm(form,fields){const out={},errs={};for(const f of fields){const el=form.elements[f.k];if(!el)continue;let v=f.type==='check'?el.checked:String(el.value).trim();
 if(f.req&&v===''){errs[f.k]='กรุณากรอกช่องนี้';continue}
 if(f.type==='number'){if(v===''){v=null}else{const n=Number(v);if(!isFinite(n)||n<0){errs[f.k]='ใส่ตัวเลขตั้งแต่ 0 ขึ้นไป';continue}if(n>1e10){errs[f.k]='ตัวเลขสูงเกินไป';continue}v=f.step==='1'?Math.floor(n):round2(n)}}
 if(f.type==='date'&&v&&!isISO(v))errs[f.k]='วันที่ไม่ถูกต้อง';
 if(f.type==='email'&&v&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))errs[f.k]='รูปแบบอีเมลไม่ถูกต้อง';
 if(f.type==='url'&&v&&!/^https?:\/\/[^\s]+$/i.test(v))errs[f.k]='ลิงก์ต้องขึ้นต้นด้วย http:// หรือ https://';
 if(f.type==='time'&&v&&!/^\d{2}:\d{2}$/.test(v))errs[f.k]='เวลาไม่ถูกต้อง';
 out[f.k]=v}return {out,errs}}

const URLS=new Map();let urlQ=new Set(),urlT=0;
function fileUrl(a){if(!a||!a.id||!SB||S.mode!=='live')return '';const c=URLS.get(a.id);if(c&&c.exp>Date.now())return c.url;urlQ.add(a.id);clearTimeout(urlT);urlT=setTimeout(()=>fetchUrls().then(schedule),20);return c?c.url:''}

function importGuests(){openModal({title:'นำเข้ารายชื่อแขกหรือคำตอบจากฟอร์ม',body:`<p class="muted" style="font-size:.9rem">ใช้ได้กับไฟล์ CSV จาก Google Sheet ของฟอร์มตอบรับ (ไฟล์ › ดาวน์โหลด › .csv) และไฟล์ที่ส่งออกจากหน้านี้ ระบบจับคู่แขกเดิมจากอีเมล เบอร์โทร หรือชื่อ แล้วอัปเดตการตอบรับให้ ไม่สร้างรายชื่อซ้ำ</p><p class="help">หัวคอลัมน์ที่อ่านได้: name/ชื่อ, email/อีเมล, phone/เบอร์โทร, rsvp/ตอบรับ, plus/ผู้ติดตาม, diet/อาหาร, side/ฝ่าย, group/กลุ่ม, table/โต๊ะ, message/คำอวยพร</p><div class="field"><label for="csvFile">เลือกไฟล์ .csv</label><input id="csvFile" type="file" accept=".csv,text/csv"></div><div class="field"><label for="csvText">หรือวางข้อความ CSV</label><textarea id="csvText" class="input" rows="6" placeholder="name,email,rsvp,plus&#10;สมชาย ใจดี,somchai@example.com,yes,1"></textarea></div><p class="help" id="csvInfo" aria-live="polite"></p>`,foot:`<span></span><div class="foot-right"><button type="button" class="btn ghost" data-close>ยกเลิก</button><button type="button" class="btn primary" id="csvGo">นำเข้า</button></div>`,onMount(m){const root=m.parentNode;root.querySelector('#csvFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{root.querySelector('#csvText').value=r.result;root.querySelector('#csvInfo').textContent=`อ่านไฟล์ ${f.name} แล้ว กด “นำเข้า” เพื่อดำเนินการต่อ`};r.readAsText(f,'utf-8')};
 root.querySelector('#csvGo').onclick=()=>{const info=root.querySelector('#csvInfo');const rows=parseCSV(root.querySelector('#csvText').value);if(rows.length<2){info.textContent='ไม่พบข้อมูล ต้องมีแถวหัวคอลัมน์และอย่างน้อยหนึ่งแถว';return}
  const H={name:['name','ชื่อ','ชื่อ-นามสกุล'],side:['side','ฝ่าย'],group:['group','กลุ่ม'],phone:['phone','เบอร์โทร','โทร'],email:['email','อีเมล'],rsvp:['rsvp','ตอบรับ','attending'],plus:['plus','ผู้ติดตาม'],diet:['diet','อาหาร'],table:['table','โต๊ะ'],message:['message','คำอวยพร','ข้อความ']};
  const head=rows[0].map(h=>h.trim().toLowerCase());const idx={};for(const k in H)idx[k]=head.findIndex(h=>H[k].includes(h));if(idx.name<0){info.textContent='ต้องมีคอลัมน์ name หรือ ชื่อ';return}
  const rmap=v=>{v=(v||'').trim().toLowerCase();if(v==='ไปร่วมงาน')return 'yes';if(v==='ไม่สะดวก')return 'no';for(const [k,l] of Object.entries(RSVP))if(v===k||v===l)return k;return 'pending'};
  const smap=v=>{v=(v||'').trim();if(/^a$/i.test(v)||v==='ฝั่ง'+nameOf('A')||v===nameOf('A'))return 'A';if(/^b$/i.test(v)||v==='ฝั่ง'+nameOf('B')||v===nameOf('B'))return 'B';return 'both'};
  const gmap=v=>{v=(v||'').trim().toLowerCase();for(const [k,l] of Object.entries(GGROUP))if(v===k||v===l)return k;return 'other'};
  const norm=v=>(v||'').toLowerCase().trim();const digits=v=>(v||'').replace(/\D/g,'');
  let added=0,updated=0;
  rows.slice(1).forEach(r=>{const g=k=>idx[k]>=0?(r[idx[k]]||'').trim():'';const name=g('name');if(!name)return;const email=norm(g('email')).slice(0,120);const phone=g('phone').slice(0,40);const msg=g('message').slice(0,500);const all=arr('guests');
   const ex=(email&&all.find(x=>norm(x.email)===email))||(digits(phone).length>=9&&all.find(x=>digits(x.phone)===digits(phone)))||all.find(x=>norm(x.name)===norm(name));
   const plus=Math.min(20,Math.max(0,Math.floor(num(g('plus')))));
   if(ex){const n=clone(ex);if(idx.rsvp>=0&&g('rsvp'))n.rsvp=rmap(g('rsvp'));if(idx.plus>=0&&g('plus')!=='')n.plus=plus;if(g('diet'))n.diet=g('diet').slice(0,120);if(g('table'))n.table=g('table').slice(0,20);if(g('side'))n.side=smap(g('side'));if(g('group'))n.group=gmap(g('group'));if(email&&!n.email)n.email=email;if(phone&&!n.phone)n.phone=phone;if(msg&&!(n.notes||'').includes(msg))n.notes=((n.notes?n.notes+'\n':'')+'คำอวยพร: '+msg).slice(0,1000);if(Store.put('guests',n))updated++}
   else{const n={id:uid(),name:name.slice(0,120),side:smap(g('side')),group:gmap(g('group')),phone,email,rsvp:rmap(g('rsvp')),plus,diet:g('diet').slice(0,120),table:g('table').slice(0,20),notes:msg?'คำอวยพร: '+msg:''};if(Store.put('guests',n))added++}});
  if(added+updated){logAct(`นำเข้าแขก: เพิ่มใหม่ ${added} · อัปเดต ${updated}`);toast(`เพิ่มใหม่ ${added} คน · อัปเดต ${updated} คน`)}else toast('ไม่มีแถวที่นำเข้าได้','bad');closeModal()}}})}

async function saveFile(filename,data){try{const blob=data instanceof Blob?data:new Blob([data],{type:/\.json$/.test(filename)?'application/json':'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('ดาวน์โหลดแล้ว')}catch(e){toast('ดาวน์โหลดไม่สำเร็จ','bad')}}

let SB=null,chan=null,loadingWs=false,hiddenAt=0;
function teardown(){if(chan&&SB){try{SB.removeChannel(chan)}catch(e){}}chan=null}
async function loadMembers(){const r=await SB.from('workspace_members').select('user_id,partner,email').eq('workspace_id',S.ws);if(!r.error)S.members=r.data||[]}
function assetsApi(){return {upload:async f=>{const safe=(f.name||'file').replace(/[^A-Za-z0-9._-]/g,'_').slice(-60);const path=`${S.ws}/${uid()}-${safe}`;const r=await SB.storage.from('files').upload(path,f,{contentType:f.type||undefined,upsert:false});if(r.error)throw r.error;return {id:path,contentType:f.type}},delete:async id=>{await SB.storage.from('files').remove([id])}}}
async function loadWorkspace(quiet){if(loadingWs)return;loadingWs=true;try{if(!quiet){S.mode='loading';schedule()}S.uid=S.session.user.id;
 const mem=await SB.from('workspace_members').select('workspace_id').eq('user_id',S.uid);if(mem.error)throw mem.error;
 if(!mem.data.length){teardown();S.ws=null;S.settings=null;S.mode='choose';schedule();return}
 const pick=store('ourday-ws');const m=mem.data.find(x=>x.workspace_id===pick)||mem.data[0];if(S.ws&&S.ws!==m.workspace_id)teardown();S.ws=m.workspace_id;store('ourday-ws',S.ws);
 const w=await SB.from('workspaces').select('id,settings,invite_code,rsvp_token').eq('id',S.ws).single();if(w.error)throw w.error;
 S.wsMeta={invite:w.data.invite_code,token:w.data.rsvp_token};S.settings=w.data.settings&&Object.keys(w.data.settings).length?clone(w.data.settings):null;
 await loadMembers();const data={};COLS.forEach(c=>data[c]=new Map());
 for(let from=0;;from+=1000){const r=await SB.from('records').select('col,id,data').eq('workspace_id',S.ws).order('col').order('id').range(from,from+999);if(r.error)throw r.error;r.data.forEach(x=>{if(data[x.col]){const d=Object.assign({},x.data);d.id=x.id;data[x.col].set(x.id,d)}});if(r.data.length<1000)break}
 S.data=data;S.mode='live';S.canWrite=true;S.assets=assetsApi();if(!chan)subscribe();schedule()}catch(e){console.error(e);if(!quiet){S.mode='error';S.err=e.message||String(e)}schedule()}finally{loadingWs=false}}
function onRec(p){const r=p.new;if(!r||r.workspace_id!==S.ws||!S.data[r.col])return;const d=Object.assign({},r.data);d.id=r.id;S.data[r.col].set(r.id,d);schedule()}
function subscribe(){teardown();const ws=S.ws;chan=SB.channel('ws-'+ws)
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'records',filter:'workspace_id=eq.'+ws},onRec)
 .on('postgres_changes',{event:'UPDATE',schema:'public',table:'records',filter:'workspace_id=eq.'+ws},onRec)
 .on('postgres_changes',{event:'DELETE',schema:'public',table:'records'},p=>{const o=p.old||{};if(o.workspace_id===ws&&S.data[o.col]){S.data[o.col].delete(o.id);schedule()}})
 .on('postgres_changes',{event:'UPDATE',schema:'public',table:'workspaces',filter:'id=eq.'+ws},p=>{const n=p.new||{};if(n.settings&&Object.keys(n.settings).length)S.settings=clone(n.settings);if(n.invite_code&&S.wsMeta)S.wsMeta.invite=n.invite_code;schedule()})
 .on('postgres_changes',{event:'*',schema:'public',table:'workspace_members',filter:'workspace_id=eq.'+ws},()=>{loadMembers().then(schedule)})
 .subscribe()}
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();return}if(S.mode==='live'&&hiddenAt&&Date.now()-hiddenAt>120000)loadWorkspace(true)});

boot();
})();
